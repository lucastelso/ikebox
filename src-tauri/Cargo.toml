[package]
name = "ipsec-client-app"
description = "IPsec Client: desktop app (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "ipsec_client_app"
crate-type = ["rlib"]

[[bin]]
name = "ipsec-client"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# The Docker engine, for development and tests only (see crates/core). Release
# builds leave it off.
docker = ["ipsec-client-core/docker"]

[dependencies]
dbus = "0.9.12"
ipsec-client-core = { path = "../crates/core" }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
tokio = { version = "1.54.1", features = ["sync", "time"] }
tracing = "0.1.44"
zeroize = "1.9.2"

[dev-dependencies]
tempfile = "3.27.0"
