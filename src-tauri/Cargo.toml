[package]
name = "ipsec-client-app"
description = "IPsec Client: app desktop (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "ipsec_client_app"
crate-type = ["rlib"]

[[bin]]
name = "ipsec-client"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
ipsec-client-core = { path = "../crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri = "2.12"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }

[dev-dependencies]
tempfile = "3.27.0"
