[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/proto", "crates/helper", "src-tauri"]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/lucastelso/ipsec-client"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
todo = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
