# Git hooks managed by lefthook (https://lefthook.dev).
# Installed automatically by `npm install` (the "prepare" script).

pre-commit:
  parallel: true
  commands:
    private-data:
      run: scripts/check-private.sh
    shellcheck:
      glob: "*.sh"
      run: scripts/lint-sh.sh {staged_files}
    biome:
      glob: "*.{ts,tsx,json,css}"
      run: npx --no -- biome check --no-errors-on-unmatched {staged_files}
    rustfmt:
      glob: "*.rs"
      run: scripts/check-rust.sh --fmt

commit-msg:
  commands:
    private-data:
      run: scripts/check-private.sh --message {1}
    commitlint:
      run: npx --no -- commitlint --edit {1}

pre-push:
  commands:
    history-without-private-data:
      run: scripts/check-private.sh --history
