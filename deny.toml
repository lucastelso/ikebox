# cargo-deny: licenses, vulnerabilities (RustSec), banned crates and sources.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Reviewed exceptions: compile-time macros only (not in the binary), no known
# vulnerability and no alternative in the Tauri 2 ecosystem.
# Review on every Tauri/specta update.
ignore = [
    # paste: a proc-macro used by specta (typed IPC, ADR-0009).
    { id = "RUSTSEC-2024-0436", reason = "build-time proc-macro through specta; no run-time code" },
    # proc-macro-error: via glib-macros 0.18 (GTK3 of Tauri 2 on Linux).
    { id = "RUSTSEC-2024-0370", reason = "build-time proc-macro through glib-macros (Tauri 2's GTK3); no alternative until GTK4" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

# The project's own crates: GPL-3.0-or-later (ADR-0017). Dependencies stay
# restricted to the permissive list above.
exceptions = [
    { allow = ["GPL-3.0-or-later"], crate = "ipsec-client-core" },
    { allow = ["GPL-3.0-or-later"], crate = "ipsec-client-cli" },
    { allow = ["GPL-3.0-or-later"], crate = "ipsec-client-app" },
    { allow = ["GPL-3.0-or-later"], crate = "ipsec-client-proto" },
    { allow = ["GPL-3.0-or-later"], crate = "ipsec-client-helper" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates (not published).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
