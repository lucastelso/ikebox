# cargo-deny: licenças, vulnerabilidades (RustSec), crates banidos e origens.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Exceções revisadas: só macros de compilação (não entram no binário), sem
# vulnerabilidade conhecida e sem alternativa no ecossistema do Tauri 2.
# Revisar a cada atualização do Tauri/specta.
ignore = [
    # paste: proc-macro usada pelo specta (IPC tipado, ADR-0009).
    { id = "RUSTSEC-2024-0436", reason = "proc-macro de compilação via specta; sem código em tempo de execução" },
    # proc-macro-error: via glib-macros 0.18 (GTK3 do Tauri 2 no Linux).
    { id = "RUSTSEC-2024-0370", reason = "proc-macro de compilação via glib-macros (GTK3 do Tauri 2); sem alternativa até o GTK4" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

# Os crates do próprio projeto: GPL-3.0-or-later (ADR-0017). As dependências
# continuam restritas à lista permissiva acima.
exceptions = [
    { allow = ["GPL-3.0-or-later"], crate = "ipsec-client-core" },
    { allow = ["GPL-3.0-or-later"], crate = "ipsec-client-cli" },
    { allow = ["GPL-3.0-or-later"], crate = "ipsec-client-app" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Dependências por caminho entre crates do workspace (não publicados).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
