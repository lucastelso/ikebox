# ipsec-client: configuração do charon dentro do engine.
#
# Carregado depois dos arquivos do pacote (prefixo "zz-"), então vence os
# padrões. A parte que depende do runtime (interface, nível de log) é escrita
# pelo entrypoint em zzz-ipsec-client-runtime.conf.
# Ver docs/adr/0003-controle-via-vici.md e docs/adr/0004-roteamento-por-interface-xfrm.md.

charon {
    # As rotas são instaladas pelo updown na interface XFRM dedicada.
    install_routes = no

    plugins {
        # Socket de controle no diretório compartilhado com o host.
        # O entrypoint ajusta o dono e a permissão (root:<gid do usuário>, 0660).
        vici {
            socket = unix:///run/ipsec-client/charon.vici
        }

        # O DNS é configurado pelo updown via resolvectl. O plugin resolve
        # escreveria no /etc/resolv.conf do container, sem efeito no host, e
        # consumiria os DNS recebidos antes do updown (PLUTO_DNS4_*).
        resolve {
            load = no
        }

        # Repassa os DNS recebidos do gateway ao updown (PLUTO_DNS4_<n>).
        # Sem isso, o atributo INTERNAL_IP4_DNS fica sem tratador.
        updown {
            dns_handler = yes
        }

        # Controle só via VICI.
        stroke {
            load = no
        }
    }

    # Log no stderr (visível em `docker logs`). Nível baixo: níveis >= 3
    # podem registrar material sensível.
    filelog {
        stderr {
            default = 1
            ike_name = yes
            time_format = %Y-%m-%d %H:%M:%S
            flush_line = yes
        }
    }

    # Sem syslog dentro do container.
    syslog {
        daemon {
            default = -1
        }
    }
}
