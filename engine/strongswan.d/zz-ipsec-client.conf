# ipsec-client: charon configuration inside the engine.
#
# Loaded after the package files ("zz-" prefix), so it wins over the
# defaults. The runtime-dependent part (interface, log level, forced updown
# and if_id) is written by the entrypoint.
# See docs/adr/0003-control-via-vici.md and docs/adr/0004-routing-by-xfrm-interface.md.

charon {
    # Routes are installed by the updown on the dedicated XFRM interface.
    install_routes = no

    plugins {
        # Control socket in the directory shared with the host.
        # The entrypoint sets its owner and permissions (the user's uid, 0600).
        vici {
            socket = unix:///run/ipsec-client/charon.vici
        }

        # DNS is configured by the updown via resolvectl. The resolve plugin
        # would write to the container's /etc/resolv.conf, with no effect on the
        # host, and would consume the received DNS servers before the updown
        # (PLUTO_DNS4_*).
        resolve {
            load = no
        }

        # Passes the DNS servers received from the gateway to the updown
        # (PLUTO_DNS4_<n>). Without it, INTERNAL_IP4_DNS has no handler.
        updown {
            dns_handler = yes
        }

        # Control via VICI only.
        stroke {
            load = no
        }
    }

    # Log to stderr (journal / `docker logs`). Low level: levels >= 3 may log
    # sensitive material.
    filelog {
        stderr {
            default = 1
            ike_name = yes
            time_format = %Y-%m-%d %H:%M:%S
            flush_line = yes
        }
    }

    # No syslog inside the engine.
    syslog {
        daemon {
            default = -1
        }
    }
}
