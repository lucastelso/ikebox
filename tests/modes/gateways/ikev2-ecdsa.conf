# TEST gateway for tests/modes: IKEv2 with ECDSA certificates on both sides
# (the gateway's on P-384, the client's on P-256, both from the ECDSA test CA
# made at test time, tests/systemd/run.sh) and only ECP Diffie-Hellman groups.
# The embedded engine verifies and signs ECDSA through OpenSSL (ADR-0027).
# Documentation values only (RFC 5737/2606).

connections {
    ikev2-ecdsa {
        version = 2
        pools = vips
        proposals = aes256gcm16-prfsha384-ecp384,aes128gcm16-prfsha256-ecp256
        send_cert = always

        local {
            auth = pubkey
            certs = gateway-ec.pem
            id = gw.ipsec-client.test
        }
        remote {
            auth = pubkey
            cacerts = ec-ca.pem
        }

        children {
            rede {
                local_ts = 192.0.2.0/24
                esp_proposals = aes256gcm16-ecp384,aes128gcm16-ecp256
            }
        }
    }
}

pools {
    vips {
        addrs = 198.51.100.10-198.51.100.20
    }
}
