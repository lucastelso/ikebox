# TEST gateway for tests/modes: IKEv1 main mode, group PSK + XAuth, with short
# lifetimes so that the GATEWAY renews phase 1 (a full reauthentication in
# IKEv1) and phase 2 during the test: the client must answer as a responder
# and keep the tunnel (program to 1.0.0, phase D; audit P8).
# Documentation values only (RFC 5737/2606) and FAKE credentials.

connections {
    rekey {
        version = 1
        aggressive = no
        pools = vips
        proposals = aes256-sha256-modp2048,aes128-sha1-modp1024
        dpd_delay = 30s
        # Phase 1: reauthenticated by the gateway every ~40 s.
        rekey_time = 40s
        rand_time = 0s

        local {
            auth = psk
            id = gw.ipsec-client.test
        }
        # In main mode the PSK is chosen before the identities are known
        # (they travel encrypted with it): the secret below has no owner.
        remote-1 {
            auth = psk
        }
        remote-2 {
            auth = xauth
        }

        children {
            rede {
                local_ts = 192.0.2.0/24
                esp_proposals = aes256-sha256-modp2048,aes256-sha256
                # Phase 2: renewed by the gateway every ~15 s.
                rekey_time = 15s
                rand_time = 0s
            }
        }
    }
}

pools {
    vips {
        addrs = 198.51.100.10-198.51.100.20
        dns = 192.0.2.53
    }
}

secrets {
    ike-qualquer {
        secret = ipsec-client-test-psk
    }
    xauth-usuario-teste {
        id = usuario.teste
        secret = senha-de-teste
    }
}
