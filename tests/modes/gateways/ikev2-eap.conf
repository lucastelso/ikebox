# TEST gateway for tests/modes: IKEv2 with EAP-MSCHAPv2 (username and
# password), the gateway authenticated by a certificate from a test CA made at
# test time (tests/systemd/run.sh, GATEWAY_PKI). ADR-0023.
# Documentation values only (RFC 5737/2606) and FAKE credentials.

connections {
    ikev2-eap {
        version = 2
        pools = vips
        proposals = aes256-sha256-modp2048,aes256gcm16-prfsha256-curve25519
        send_cert = always

        local {
            auth = pubkey
            certs = gateway.pem
            id = gw.ikebox.test
        }
        # EAP-Identity first: the client says its username.
        remote {
            auth = eap-mschapv2
            eap_id = %any
        }

        children {
            rede {
                local_ts = 192.0.2.0/24
                esp_proposals = aes256-sha256-modp2048,aes256-sha256,aes256gcm16
            }
        }
    }
}

pools {
    vips {
        addrs = 198.51.100.10-198.51.100.20
        dns = 192.0.2.53
    }
}

secrets {
    eap-usuario-teste {
        id = usuario.teste
        secret = senha-de-teste
    }
}
