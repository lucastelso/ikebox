# TEST gateway for tests/modes: IKEv1 AGGRESSIVE mode, group PSK only (no
# XAuth), legacy algorithms.
# Documentation values only (RFC 5737/2606) and FAKE credentials.

connections {
    aggr-psk {
        version = 1
        aggressive = yes
        pools = vips
        proposals = aes256-sha1-modp1024
        dpd_delay = 30s

        local {
            auth = psk
            id = gw.ikebox.test
        }
        remote {
            auth = psk
            id = keyid:grupo-teste
        }

        children {
            rede {
                local_ts = 192.0.2.0/24
                esp_proposals = aes256-sha1-modp1024,aes256-sha1
            }
        }
    }
}

pools {
    vips {
        addrs = 198.51.100.10-198.51.100.20
    }
}

secrets {
    ike-grupo-teste {
        id = keyid:grupo-teste
        secret = ikebox-test-psk
    }
}
