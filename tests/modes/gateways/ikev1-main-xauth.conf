# TEST gateway for tests/modes: IKEv1 MAIN mode, group PSK + XAuth.
# Documentation values only (RFC 5737/2606) and FAKE credentials.

connections {
    main-xauth {
        version = 1
        aggressive = no
        pools = vips
        proposals = aes256-sha256-modp2048,aes128-sha1-modp1024
        dpd_delay = 30s

        local {
            auth = psk
            id = gw.ipsec-client.test
        }
        # In main mode the PSK is chosen before the identities are known
        # (they travel encrypted with it): the secret below has no owner.
        remote-1 {
            auth = psk
        }
        remote-2 {
            auth = xauth
        }

        children {
            # With and without PFS: the client decides by its proposals.
            rede {
                local_ts = 192.0.2.0/24
                esp_proposals = aes256-sha256-modp2048,aes256-sha256
            }
            tudo {
                local_ts = 0.0.0.0/0
                esp_proposals = aes256-sha256-modp2048,aes256-sha256
            }
        }
    }
}

pools {
    vips {
        addrs = 198.51.100.10-198.51.100.20
        dns = 192.0.2.53
    }
}

secrets {
    ike-qualquer {
        secret = ipsec-client-test-psk
    }
    xauth-usuario-teste {
        id = usuario.teste
        secret = senha-de-teste
    }
}
