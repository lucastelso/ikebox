# TEST gateway for tests/modes: IKEv2 with PSK, modern algorithms.
# Documentation values only (RFC 5737/2606) and FAKE credentials.

connections {
    ikev2-psk {
        version = 2
        pools = vips
        proposals = aes256gcm16-prfsha256-curve25519,aes256-sha256-modp2048
        dpd_delay = 30s

        local {
            auth = psk
            id = gw.ikebox.test
        }
        remote {
            auth = psk
        }

        children {
            # In IKEv2 the first CHILD_SA comes out of IKE_AUTH without a DH
            # exchange: the PFS group only shows up on rekey.
            rede {
                local_ts = 192.0.2.0/24
                esp_proposals = aes256gcm16-curve25519,aes256gcm16,aes256-sha256-modp2048,aes256-sha256
            }
            tudo {
                local_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16-curve25519,aes256gcm16,aes256-sha256-modp2048,aes256-sha256
            }
        }
    }

    # In IKEv2 a gateway with a pool requires the client to ask for a virtual
    # IP (FAILED_CP_REQUIRED otherwise). Clients without one are told apart by
    # their identity and get a connection without a pool.
    ikev2-psk-novip {
        version = 2
        proposals = aes256gcm16-prfsha256-curve25519,aes256-sha256-modp2048

        local {
            auth = psk
            id = gw.ikebox.test
        }
        remote {
            auth = psk
            id = novip.ikebox.test
        }

        children {
            rede {
                local_ts = 192.0.2.0/24
                esp_proposals = aes256gcm16-curve25519,aes256gcm16
            }
        }
    }
}

pools {
    vips {
        addrs = 198.51.100.10-198.51.100.20
        dns = 192.0.2.53
    }
}

secrets {
    ike-qualquer {
        secret = ikebox-test-psk
    }
}
