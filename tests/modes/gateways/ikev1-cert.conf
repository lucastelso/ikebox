# TEST gateway for tests/modes: IKEv1 MAIN mode with certificates on both
# sides, then XAuth ("mutual RSA + XAuth", as on Cisco ASA). The client's and
# the gateway's certificates come from the test CA made at test time
# (tests/systemd/run.sh, GATEWAY_PKI). ADR-0024.
# Documentation values only (RFC 5737/2606) and FAKE credentials.

connections {
    ikev1-cert {
        version = 1
        aggressive = no
        pools = vips
        proposals = aes256-sha256-modp2048
        send_cert = always

        local {
            auth = pubkey
            certs = gateway.pem
            id = gw.ipsec-client.test
        }
        remote-1 {
            auth = pubkey
            cacerts = ca.pem
        }
        remote-2 {
            auth = xauth
        }

        children {
            rede {
                local_ts = 192.0.2.0/24
                esp_proposals = aes256-sha256-modp2048
            }
        }
    }
}

pools {
    vips {
        addrs = 198.51.100.10-198.51.100.20
    }
}

secrets {
    xauth-usuario-teste {
        id = usuario.teste
        secret = senha-de-teste
    }
}
