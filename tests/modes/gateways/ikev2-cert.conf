# TEST gateway for tests/modes: IKEv2 with certificates on both sides: the
# client's (imported from a .p12) and the gateway's, both from the test CA
# made at test time (tests/systemd/run.sh, GATEWAY_PKI). ADR-0024.
# Documentation values only (RFC 5737/2606).

connections {
    ikev2-cert {
        version = 2
        pools = vips
        proposals = aes256-sha256-modp2048,aes256gcm16-prfsha256-curve25519
        send_cert = always

        local {
            auth = pubkey
            certs = gateway.pem
            id = gw.ikebox.test
        }
        # Any client certificate from the test CA.
        remote {
            auth = pubkey
            cacerts = ca.pem
        }

        children {
            rede {
                local_ts = 192.0.2.0/24
                esp_proposals = aes256-sha256-modp2048,aes256-sha256,aes256gcm16
            }
        }
    }
}

pools {
    vips {
        addrs = 198.51.100.10-198.51.100.20
    }
}
