# Gateway IPsec de TESTE (responder) — imita uma VPN legada.
# Somente valores de documentação (RFC 5737/2606) e credenciais FALSAS.

connections {
    gateway-teste {
        version = 1
        aggressive = yes
        encap = yes
        pools = vips-teste
        proposals = aes256-sha1-modp1024,aes128-sha1-modp1024
        dpd_delay = 30s

        local {
            auth = psk
            id = gw.ipsec-client.test
        }
        # Rodada 1: PSK do "grupo".
        remote-1 {
            auth = psk
            id = keyid:grupo-teste
        }
        # Rodada 2: XAuth (usuário/senha pessoal).
        remote-2 {
            auth = xauth
        }

        children {
            rede-teste {
                local_ts = 192.0.2.0/24
                esp_proposals = aes256-sha1-modp1024,aes256-sha1-modp768,aes128-sha1-modp1024
            }
            # Só PFS modp768 na fase 2, como VPNs legadas que pedem DH1
            # (cenário 4 do e2e.sh). Rede própria (TEST-NET-3) para o child ser escolhido.
            rede-modp768 {
                local_ts = 203.0.113.0/24
                esp_proposals = aes256-sha1-modp768
            }
            # Túnel completo (cenário 3 do e2e.sh).
            tudo {
                local_ts = 0.0.0.0/0
                esp_proposals = aes256-sha1-modp1024,aes256-sha1-modp768,aes128-sha1-modp1024
            }
        }
    }
}

pools {
    vips-teste {
        addrs = 198.51.100.10-198.51.100.20
        dns = 192.0.2.53
    }
}

secrets {
    ike-grupo-teste {
        id = keyid:grupo-teste
        secret = ipsec-client-test-psk
    }
    xauth-usuario-teste {
        id = usuario.teste
        secret = senha-de-teste
    }
}
