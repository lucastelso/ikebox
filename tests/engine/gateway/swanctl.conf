# TEST IPsec gateway (responder) — imitates a legacy VPN.
# Documentation values only (RFC 5737/2606) and FAKE credentials.

connections {
    gateway-teste {
        version = 1
        aggressive = yes
        encap = yes
        pools = vips-teste
        proposals = aes256-sha1-modp1024,aes128-sha1-modp1024
        dpd_delay = 30s

        local {
            auth = psk
            id = gw.ipsec-client.test
        }
        # Round 1: the "group" PSK.
        remote-1 {
            auth = psk
            id = keyid:grupo-teste
        }
        # Round 2: XAuth (personal username and password).
        remote-2 {
            auth = xauth
        }

        children {
            rede-teste {
                local_ts = 192.0.2.0/24
                esp_proposals = aes256-sha1-modp1024,aes256-sha1-modp768,aes128-sha1-modp1024
            }
            # Only PFS modp768 in phase 2, like legacy VPNs that ask for DH1 (scenario 4
            # of e2e.sh). A network of its own (TEST-NET-3) so the child is chosen.
            rede-modp768 {
                local_ts = 203.0.113.0/24
                esp_proposals = aes256-sha1-modp768
            }
            # Full tunnel (scenario 3 of e2e.sh).
            tudo {
                local_ts = 0.0.0.0/0
                esp_proposals = aes256-sha1-modp1024,aes256-sha1-modp768,aes128-sha1-modp1024
            }
        }
    }
}

pools {
    vips-teste {
        addrs = 198.51.100.10-198.51.100.20
        dns = 192.0.2.53
    }
}

secrets {
    ike-grupo-teste {
        id = keyid:grupo-teste
        secret = ipsec-client-test-psk
    }
    xauth-usuario-teste {
        id = usuario.teste
        secret = senha-de-teste
    }
}
