[package]
name = "ipsec-client-core"
description = "Núcleo do ipsec-client: perfis, segredos, engine, sessão e diagnóstico"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Testes de integração que sobem o engine no Docker real e alteram a rede do
# host temporariamente (interface ipsct1). Rodar com: npm run test:docker
docker-tests = []

[dependencies]
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
futures-util = "0.3.34"
hex = "0.4.3"
ipsec-client-proto = { version = "0.0.0", path = "../proto" }
keyring-core = "1.0.1"
rustix = { version = "1.1.6", features = ["process"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "fs", "time", "sync", "net", "io-util"] }
tracing = "0.1.44"
zeroize = "1.9.1"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
