[package]
name = "ipsec-client-core"
description = "ipsec-client core: profiles, secrets, engine, session and diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Testes de integração que sobem o engine no Docker real e alteram a rede do
# host temporariamente (interface ipsct1). Rodar com: npm run test:docker
docker-tests = ["docker"]
# The Docker engine (ADR-0001): development and tests only. Off by default, so
# that release builds never carry it (audit of 0.2.0, phase 4).
docker = ["dep:bollard", "dep:futures-util", "dep:tar"]

[dependencies]
bollard = { version = "0.21.1", default-features = false, features = ["pipe"], optional = true }
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
futures-util = { version = "0.3.34", optional = true }
hex = "0.4.3"
ipsec-client-proto = { version = "0.9.0", path = "../proto" }
keyring-core = "1.0.1"
p12-keystore = "0.4.1"
pkcs1 = "0.8.0"
pkcs8 = "0.11.0"
roxmltree = "0.21.2"
rustix = { version = "1.1.6", features = ["process"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = { version = "0.4.46", optional = true }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "fs", "time", "sync", "net", "io-util"] }
tracing = "0.1.44"
x509-cert = { version = "0.3.0", features = ["pem"] }
zeroize = "1.9.1"

[dev-dependencies]
insta = "1.49.0"
