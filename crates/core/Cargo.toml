[package]
name = "ipsec-client-core"
description = "Núcleo do ipsec-client: perfis, segredos, engine, sessão e diagnóstico"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Testes de integração que sobem o engine no Docker real e alteram a rede do
# host temporariamente (interface ipsct1). Rodar com: npm run test:docker
docker-tests = []

[dependencies]
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
futures-util = "0.3.34"
hex = "0.4.3"
rustix = { version = "1.1.6", features = ["process"] }
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "fs", "time", "sync", "net"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
