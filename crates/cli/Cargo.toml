[package]
name = "ipsec-client-cli"
description = "ipsec-client command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "ipsec-client-cli"
path = "src/main.rs"

[features]
# The Docker engine, for development and tests only (see crates/core). Release
# builds leave it off.
docker = ["ipsec-client-core/docker"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.12"
clap_mangen = "0.3.4"
ipsec-client-core = { path = "../core" }
rpassword = "7.5.5"
secrecy = "0.10.3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1.9.2"
