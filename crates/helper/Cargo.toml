[package]
name = "ikebox-helper"
description = "Privileged Ikebox helper: starts and stops the embedded engine (root, systemd)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# Our own lints: the same as the workspace, but `unsafe_code = "deny"` (not
# "forbid") to allow ONE justified exception: adopting the socket inherited
# through systemd's socket activation (descriptor 3).
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[[bin]]
name = "ikebox-helper"
path = "src/main.rs"

[dependencies]
dbus = "0.9.12"
ikebox-proto = { path = "../proto" }
rustix = { version = "1.1.6", features = ["net", "process", "fs"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
