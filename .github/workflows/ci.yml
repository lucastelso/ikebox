name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks (npm run check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Commit messages (PR)
        if: github.event_name == 'pull_request'
        run: >-
          npx --no -- commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
      - run: npm run check:private && npm run lint:sh && npm run test:updown
      - name: Frontend (biome, tsc, vitest, build)
        run: npm run lint:web && npm run typecheck && npm run test:web && npm run build

  rust:
    name: Rust (fmt, clippy, tests, cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System dependencies (Tauri + libdbus)
        run: >-
          sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - name: clippy, release build (no Docker engine) and development build
        run: >-
          cargo clippy --workspace --all-targets --locked -- -D warnings &&
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: tests, both builds
        run: >-
          cargo test --workspace --locked &&
          cargo test --workspace --locked
          --features ipsec-client-core/docker,ipsec-client-cli/docker,ipsec-client-app/docker
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  secrets:
    name: Secret scanner (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: >-
          docker run --rm --network none -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner -v

  engine-e2e:
    name: Engine (end-to-end test with a local gateway)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: xfrm_interface module
        run: sudo modprobe xfrm_interface && lsmod | grep -E '^(xfrm_interface|esp4)'
      - name: e2e (shell)
        run: tests/engine/e2e.sh
      - name: System dependencies (libdbus for the keyring)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Toolchain Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Rust core integration with Docker (engine, VICI, session)
        run: scripts/check-rust.sh --docker-tests
      - name: Full CLI flow
        run: tests/cli/e2e.sh

  native-engine:
    name: Embedded engine (compiled strongSwan + E2E)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: xfrm_interface module
        run: sudo modprobe xfrm_interface
      - name: Build (SHA-256 + GPG + patches) and E2E with 5 scenarios (includes the ADR-0019 attack)
        run: npm run test:native
      - name: System dependencies (libdbus for the CLI)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Toolchain Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: With real systemd (installer, helper, sandbox, two users and the attack)
        run: npm run test:systemd

  packaging:
    name: Network component installer (container)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, update, remove and refuse tampered bundles
        run: npm run test:packaging
